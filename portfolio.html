<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Tracker</title>

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Geist font (per frontend-dev skill, NEVER use Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

  <!-- Google Identity Services (ADR 0008) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: -0.011em;
    }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Alpine x-cloak: hide elements until Alpine has booted. Used on banners
       that flash their initial state before Alpine evaluates x-show. */
    [x-cloak] { display: none !important; }

    /* 52-week range bar (v1.1 — spec §4.3, ADR 0009 §9).
       Horizontal track with a dot marker showing where current price sits
       in [low_52w, high_52w]. Marker clamps to [0, 1] for out-of-range. */
    .week52-bar {
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
      min-width: 120px;
    }
    .week52-track {
      position: relative;
      width: 120px;
      height: 4px;
      background: #e2e8f0;  /* slate-200 */
      border-radius: 2px;
    }
    .week52-marker {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      background: #2563eb;  /* blue-600 */
      border: 2px solid white;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .week52-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #64748b;  /* slate-500 */
      font-variant-numeric: tabular-nums;
    }
    .week52-placeholder {
      display: inline-block;
      min-width: 120px;
      color: #94a3b8;  /* slate-400 */
      font-size: 0.875rem;
    }
    @media (max-width: 600px) {
      .week52-bar, .week52-track, .week52-placeholder { min-width: 80px; width: 80px; }
    }

    /* Refresh-failed row indicator (v1.1 — ADR 0009 §4).
       The _refresh_failed flag is in-memory only; clears on next refresh. */
    tr.refresh-failed {
      background-color: #fff1f2;  /* rose-50 */
      box-shadow: inset 3px 0 0 0 #f43f5e;  /* rose-500 left border */
    }
    tr.refresh-failed:hover {
      background-color: #ffe4e6;  /* rose-100 */
    }

    /* Header "..." menu (HTML <details>]. Zero deps, accessible by default. */
    .header-menu { position: relative; }
    .header-menu > summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      background: white;
      color: #475569;
      font-size: 1rem;
      transition: background-color 0.15s;
      user-select: none;
    }
    .header-menu > summary::-webkit-details-marker { display: none; }
    .header-menu > summary:hover { background: #f8fafc; }
    .header-menu[open] > summary { background: #f1f5f9; }
    .header-menu-items {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 14rem;
      z-index: 50;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }
    .header-menu-items button {
      text-align: left;
      width: 100%;
    }

    /* Mobile: refresh button becomes icon-only below 600px */
    @media (max-width: 600px) {
      .refresh-btn-text { display: none; }
      .refresh-btn { padding-left: 0.5rem; padding-right: 0.5rem; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">

<div x-data="portfolio()" x-init="init()">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold tracking-tight" x-text="t('app.title')"></h1>
        <p class="text-xs text-slate-500 mt-0.5" x-text="summary"></p>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <!-- Language toggle -->
        <div class="inline-flex rounded-md border border-slate-200 p-0.5 text-sm">
          <button @click="setLanguage('en')"
            :class="language==='en' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50'"
            class="px-3 py-1 rounded transition-colors">EN</button>
          <button @click="setLanguage('zh')"
            :class="language==='zh' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50'"
            class="px-3 py-1 rounded transition-colors">中</button>
        </div>

        <!-- Refresh prices (v1.1) — high-frequency inline. Click during refresh = cancel signal. -->
        <button @click="refreshButtonClick()"
                :title="refreshState === 'refreshing' ? t('header.refreshCancelHint') : ''"
                :class="{
                  'bg-white border-slate-200 text-slate-700 hover:bg-slate-50': refreshState === 'idle',
                  'bg-sky-50 border-sky-200 text-sky-700 hover:bg-sky-100': refreshState === 'refreshing',
                  'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100': refreshState === 'partial',
                  'bg-rose-50 border-rose-200 text-rose-700 hover:bg-rose-100': refreshState === 'error',
                }"
                class="refresh-btn text-sm px-3 py-1.5 border rounded-md transition-colors flex items-center gap-1.5">
          <span aria-hidden="true">↻</span>
          <span class="refresh-btn-text" x-text="refreshLabel"></span>
        </button>

        <!-- Retry N failed (only when there are failures) -->
        <template x-if="refreshFailures.length > 0">
          <button @click="retryFailed()"
                  class="text-sm px-3 py-1.5 border border-rose-300 rounded-md bg-rose-50 text-rose-700 hover:bg-rose-100 transition-colors flex items-center gap-1.5">
            <span aria-hidden="true">🔄</span>
            <span x-text="retryFailedLabel"></span>
          </button>
        </template>

        <!-- Sync (high-frequency inline) -->
        <button @click="headerClick()"
                :class="{
                  'border-slate-200 hover:bg-slate-50 text-slate-600 hover:text-slate-900': syncStatus === 'disconnected',
                  'border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100': syncStatus === 'error',
                  'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100': syncStatus === 'connected',
                  'border-sky-200 bg-sky-50 text-sky-700': syncStatus === 'connecting' || syncStatus === 'syncing',
                }"
                class="text-sm px-3 py-1.5 border rounded-md transition-colors"
                x-text="syncStatusLabel"></button>

        <!-- Currency toggle (high-frequency inline) -->
        <div class="inline-flex rounded-md border border-slate-200 p-0.5 text-sm">
          <button @click="setCurrency('TWD')"
            :class="displayCurrency==='TWD' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50'"
            class="px-3 py-1 rounded transition-colors">TWD</button>
          <button @click="setCurrency('USD')"
            :class="displayCurrency==='USD' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-50'"
            class="px-3 py-1 rounded transition-colors">USD</button>
        </div>

        <!-- "..." menu (low-frequency: FX rate, import, export) -->
        <details class="header-menu">
          <summary aria-label="More actions">⋯</summary>
          <div class="header-menu-items">
            <!-- FX rate (editable) -->
            <div class="flex items-center gap-1 text-xs border border-slate-200 rounded-md px-2 py-1">
              <span class="text-slate-500">1 USD =</span>
              <input type="number" x-model.number="data.settings.fx_rate"
                     @change="data.settings.fx_updated_at = new Date().toISOString()"
                     step="0.01" min="0"
                     class="w-16 text-right text-slate-900 text-sm font-medium tabular focus:outline-none">
              <span class="text-slate-500">TWD</span>
            </div>
            <!-- Import -->
            <button @click="document.getElementById('import-file-input').click()"
                    class="text-sm text-slate-600 hover:text-slate-900 px-3 py-1.5 border border-slate-200 rounded-md hover:bg-slate-50 transition-colors"
                    x-text="t('header.import')"></button>
            <!-- Export -->
            <button @click="downloadJSON()"
                    class="text-sm text-slate-600 hover:text-slate-900 px-3 py-1.5 border border-slate-200 rounded-md hover:bg-slate-50 transition-colors"
                    x-text="t('header.export')"></button>
          </div>
        </details>

        <!-- Import (hidden file input, triggered by button) -->
        <input type="file" id="import-file-input" accept=".json,application/json" class="hidden" @change="handleImportFile($event)">
      </div>
    </div>
  </header>

  <!-- Refresh error banner (v1.1 — shown when total refresh failure) -->
  <div x-show="refreshError" x-cloak class="bg-rose-50 border-b border-rose-200">
    <div class="max-w-7xl mx-auto px-6 py-2 flex items-center justify-between gap-3">
      <p class="text-xs text-rose-700" x-text="refreshErrorBanner"></p>
      <button @click="refreshError = null"
              class="text-xs text-rose-600 hover:text-rose-800 font-medium"
              x-text="t('header.dismiss')"></button>
    </div>
  </div>

  <!-- Tab bar -->
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-6 flex gap-1">
      <button @click="currentPage = 'home'"
              :class="currentPage === 'home' ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-900'"
              class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
              x-text="t('nav.home')"></button>
      <button @click="currentPage = 'holdings'"
              :class="currentPage === 'holdings' ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-900'"
              class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
              x-text="t('nav.holdings')"></button>
      <button @click="currentPage = 'cash_debt'"
              :class="currentPage === 'cash_debt' ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-900'"
              class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
              x-text="t('nav.cashDebt')"></button>
      <button @click="currentPage = 'categories'"
              :class="currentPage === 'categories' ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-900'"
              class="px-4 py-3 text-sm font-medium border-b-2 transition-colors"
              x-text="t('nav.categories')"></button>
    </div>
  </nav>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Home page -->
    <div x-show="currentPage === 'home'">

    <!-- Summary: 4 cards -->
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <!-- Net Worth -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200">
        <p class="text-xs text-slate-500 uppercase tracking-wider font-medium" x-text="t('summary.netWorth')"></p>
        <p class="text-3xl font-semibold tabular mt-2" x-text="formatAmount(netWorth(), this.displayCurrency)"></p>
        <p class="text-xs text-slate-500 mt-2"
           x-text="t('summary.netWorthSub', { a: activeHoldingsCount(), c: activeCashCount(), d: activeDebtsCount() })"></p>
      </div>
      <!-- Holdings Value -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200">
        <p class="text-xs text-slate-500 uppercase tracking-wider font-medium" x-text="t('summary.holdingsValue')"></p>
        <p class="text-3xl font-semibold tabular mt-2" x-text="formatAmount(holdingsValue(), this.displayCurrency)"></p>
        <p class="text-xs mt-2"
           :class="holdingsGainLoss() >= 0 ? 'text-emerald-600' : 'text-rose-600'">
          <span x-text="(holdingsGainLoss() >= 0 ? '+' : '') + formatAmount(holdingsGainLoss(), this.displayCurrency)"></span>
          <span x-text="' (' + (holdingsGainLossPct() >= 0 ? '+' : '') + holdingsGainLossPct().toFixed(2) + '%)'"></span>
        </p>
      </div>
      <!-- Cash -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200">
        <p class="text-xs text-slate-500 uppercase tracking-wider font-medium" x-text="t('summary.cash')"></p>
        <p class="text-3xl font-semibold tabular mt-2" x-text="formatAmount(totalCash(), this.displayCurrency)"></p>
        <p class="text-xs text-slate-500 mt-2"
           x-text="activeCashCount() + ' ' + t('summary.accounts')"></p>
      </div>
      <!-- Debts -->
      <div class="bg-white p-6 rounded-2xl border border-slate-200">
        <p class="text-xs text-slate-500 uppercase tracking-wider font-medium" x-text="t('summary.debts')"></p>
        <p class="text-3xl font-semibold tabular mt-2 text-rose-600" x-text="formatAmount(totalDebts(), this.displayCurrency)"></p>
        <p class="text-xs text-slate-500 mt-2"
           x-text="activeDebtsCount() + ' ' + t('summary.debtItems')"></p>
      </div>
    </section>

    <!-- Group by -->
    <section class="mb-8" x-show="groupByCategories.length > 0">
      <h2 class="text-lg font-semibold mb-4" x-text="t('groupBy.title')"></h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="cat in groupByCategories" :key="cat.id">
          <div class="bg-white p-4 rounded-2xl border border-slate-200">
            <h3 class="text-sm font-medium text-slate-700 mb-3" x-text="cat.name + ' (' + (cat.values || []).length + ')'"></h3>

            <!-- Holdings sub-section -->
            <div class="mb-3" x-show="holdings.length > 0 && cat.applies_to?.includes('holdings')">
              <p class="text-xs text-slate-500 mb-1 font-medium" x-text="t('groupBy.holdingsSub')"></p>
              <table class="w-full text-xs">
                <tbody>
                  <template x-for="group in holdingsGroupedBy(cat.id)" :key="group.value_id">
                    <tr x-show="group.count > 0 || group.value_id === '_unassigned'">
                      <td class="py-1" x-text="group.value_name"></td>
                      <td class="py-1 text-right text-slate-500 tabular" x-text="group.count + ' ' + t('groupBy.holdings')"></td>
                      <td class="py-1 text-right tabular font-medium" x-text="formatAmount(group.total, 'TWD')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Cash sub-section -->
            <div class="mb-3" x-show="cashAccounts.length > 0 && cat.applies_to?.includes('cash')">
              <p class="text-xs text-slate-500 mb-1 font-medium" x-text="t('groupBy.cashSub')"></p>
              <table class="w-full text-xs">
                <tbody>
                  <template x-for="group in cashGroupedBy(cat.id)" :key="group.value_id">
                    <tr x-show="group.count > 0 || group.value_id === '_unassigned'">
                      <td class="py-1" x-text="group.value_name"></td>
                      <td class="py-1 text-right text-slate-500 tabular" x-text="group.count + ' ' + t('groupBy.accounts')"></td>
                      <td class="py-1 text-right tabular font-medium" x-text="formatAmount(group.total, 'TWD')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>

            <!-- Debts sub-section -->
            <div x-show="debts.length > 0 && cat.applies_to?.includes('debt')">
              <p class="text-xs text-slate-500 mb-1 font-medium" x-text="t('groupBy.debtsSub')"></p>
              <table class="w-full text-xs">
                <tbody>
                  <template x-for="group in debtsGroupedBy(cat.id)" :key="group.value_id">
                    <tr x-show="group.count > 0 || group.value_id === '_unassigned'">
                      <td class="py-1" x-text="group.value_name"></td>
                      <td class="py-1 text-right text-slate-500 tabular" x-text="group.count + ' ' + t('groupBy.debtItems')"></td>
                      <td class="py-1 text-right tabular font-medium text-rose-600" x-text="formatAmount(group.total, 'TWD')"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </div>
    </section>

    <!-- Debug -->
    <section class="mt-8">
      <details class="bg-white rounded-2xl border border-slate-200 p-4">
        <summary class="text-sm font-medium text-slate-600 cursor-pointer">📦 Internal data (debug)</summary>
        <pre class="mt-3 text-xs text-slate-600 overflow-auto bg-slate-50 p-3 rounded" x-text="JSON.stringify(data, null, 2)"></pre>
      </details>
    </section>

    </div>

    <!-- Holdings page -->
    <div x-show="currentPage === 'holdings'">
    <section class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold" x-text="t('holdings.title')"></h2>
        <button @click="openAdd()" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-md hover:bg-slate-800 transition-colors"
                x-text="t('holdings.add')"></button>
      </div>

      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="text-left px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.ticker')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.shares')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.costPerShare')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.price')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.dayDelta')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.week52')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.value')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600" x-text="t('holdings.col.gainLoss')"></th>
              <th class="text-right px-4 py-3 font-medium text-slate-600 w-32"></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="h in holdings" :key="h.id">
              <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50"
                  :class="{
                    'opacity-50': h.inactive,
                    'refresh-failed': h._refresh_failed
                  }">
                <td class="px-4 py-3">
                  <div class="font-medium" x-text="h.ticker"></div>
                  <div class="flex flex-wrap gap-1 mt-1" x-show="h.attributes && Object.keys(h.attributes).length > 0">
                    <template x-for="(valId, catId) in (h.attributes || {})" :key="catId + '-' + valId">
                      <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded"
                            x-text="getCategoryValueName(catId, valId)"></span>
                    </template>
                  </div>
                </td>
                <td class="px-4 py-3 text-right tabular" x-text="h.shares.toLocaleString()"></td>
                <td class="px-4 py-3 text-right tabular text-slate-600" x-text="formatAmount(h.cost, h.currency)"></td>
                <td class="px-4 py-3 text-right tabular" x-text="formatAmount(h.current_price, h.currency)"></td>
                <!-- Day Δ%: ±X.XX% color-coded. '—' placeholder when prev_close is null. -->
                <td class="px-4 py-3 text-right tabular"
                    :title="h._refresh_failed ? t('holdings.tooltip.refreshFailed') : ''"
                    :class="dayDeltaClass(h)">
                  <span x-text="dayDeltaLabel(h)"></span>
                </td>
                <!-- 52W range bar: marker dot where current sits between low/high. -->
                <td class="px-4 py-3 text-right">
                  <div class="week52-bar" x-show="h.high_52w != null && h.low_52w != null"
                       :title="h._refresh_failed ? t('holdings.tooltip.refreshFailed') : ''">
                    <div class="week52-track">
                      <div class="week52-marker" :style="week52Style(h)"></div>
                    </div>
                    <div class="week52-labels">
                      <span x-text="formatAmount(h.low_52w, h.currency)"></span>
                      <span x-text="formatAmount(h.high_52w, h.currency)"></span>
                    </div>
                  </div>
                  <span class="week52-placeholder" x-show="h.high_52w == null || h.low_52w == null"
                        :title="t('holdings.tooltip.refreshToPopulate')">—</span>
                </td>
                <td class="px-4 py-3 text-right tabular font-medium" x-text="formatAmount(h.shares * h.current_price, h.currency)"></td>
                <td class="px-4 py-3 text-right tabular"
                    :class="gainLoss(h) >= 0 ? 'text-emerald-600' : 'text-rose-600'">
                  <span x-text="(gainLoss(h) >= 0 ? '+' : '') + formatAmount(gainLoss(h), h.currency)"></span>
                </td>
                <td class="px-4 py-3 text-right">
                  <button @click="toggleInactive(h.id)"
                          :class="h.inactive ? 'text-slate-400' : 'text-emerald-600'"
                          class="px-1 text-xs hover:underline"
                          x-text="h.inactive ? t('holdings.inactive') : t('holdings.active')"></button>
                  <button @click="openEdit(h)" class="text-slate-400 hover:text-slate-900 px-1 text-xs" x-text="t('holdings.edit')"></button>
                  <button @click="removeHolding(h.id)" class="text-slate-400 hover:text-rose-600 px-1 text-xs" x-text="t('holdings.delete')"></button>
                </td>
              </tr>
            </template>
            <tr x-show="holdings.length === 0">
              <td colspan="9" class="px-4 py-12 text-center text-slate-400" x-text="t('holdings.empty')"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
    </div>

    <!-- Cash & Debts page -->
    <div x-show="currentPage === 'cash_debt'">
    <section class="mb-8">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold" x-text="t('cash.title')"></h2>
        <button @click="openAddCash()" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-md hover:bg-slate-800 transition-colors"

          <button @click="disconnectDrive()" class="w-full text-sm px-3 py-2 rounded-md border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors"
                  x-text="t('sync.disconnect')"></button>
        </template>
      </div>

      <!-- Sync now + last synced -->
      <div x-show="syncAccessToken" class="mt-4 space-y-2">
        <button @click="syncNow().catch(() => {})"
                :disabled="syncStatus === 'syncing'"
                :class="syncStatus === 'syncing' ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-900 text-white hover:bg-slate-800'"
                class="w-full text-sm px-3 py-2 rounded-md transition-colors"
                x-text="syncStatus === 'syncing' ? t('sync.status.syncing') : t('sync.syncNow')"></button>
        <p class="text-xs text-slate-500 text-center">
          <span x-text="t('sync.lastSynced', { ago: relativeTime(data.meta?.last_synced_at) })"></span>
        </p>
      </div>

      <!-- Auto-sync toggle -->
      <label x-show="syncAccessToken" class="mt-4 flex items-center gap-2 cursor-pointer">
        <input type="checkbox" :checked="autoSyncEnabled" @change="toggleAutoSync()"
               class="rounded border-slate-300 text-slate-900 focus:ring-slate-900">
        <span class="text-sm text-slate-700" x-text="t('sync.autoSync')"></span>
        <span class="text-xs text-slate-400" x-text="'— ' + t('sync.autoSyncHelp')"></span>
      </label>

      <!-- Last error -->
      <div x-show="syncError" class="mt-4 p-3 bg-rose-50 border border-rose-200 rounded-md">
        <p class="text-xs font-medium text-rose-700 mb-1" x-text="t('sync.lastError')"></p>
        <p class="text-xs text-rose-600 font-mono break-all" x-text="syncError"></p>
      </div>
    </div>
  </div>

  // ===== Constants =====
  const STORAGE_KEY = 'property_tracker_portfolio_v1';
  const SYNC_CLIENT_ID_KEY = 'property_tracker_sync_client_id_v1';
  const DRIVE_FILENAME = 'property_tracker_portfolio_v1.json';
  const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

  const DEVICE_ID = (() => {
    const existing = localStorage.getItem('device_id');
    if (existing) return existing;
    const id = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('device_id', id);
    return id;
  })();

  function genId(prefix) {
    return prefix + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
  }

  function defaultPortfolio() {
    return {
      version: '1.1',
      meta: {
        device_id: DEVICE_ID,
        last_synced_at: null,
        created_at: new Date().toISOString(),
      },
      settings: {
        cost_format: 'per_share',
        display_currency: 'TWD',
        fx_source: 'manual',
        fx_rate: 32.2,
        fx_updated_at: new Date().toISOString(),
        language: 'en',
      },
      categories: [],
      holdings: [],
      cash_accounts: [],
      debts: [],
      snapshots: [],
      // v1.3: deletion log (true-delete tombstones) + in-portfolio backups
      // (Layer 1 of the two-layer backup safety net). Both arrays are
      // additive — see ADR 0011 / ADR 0012 (drafts — ticket 04).
      deletions: [],
      backups: [],
    };
  }

  function defaultCategory() {
    return { id: '', name: 'New Category', values: [], applies_to: ['holdings', 'cash', 'debt'] };
  }

  // ===== Main factory =====
  function portfolio() {
    return {
      // ---- State ----
      data: defaultPortfolio(),
      displayCurrency: 'TWD',
      language: 'en',
      currentPage: 'home',

      // Holdings modal state
      showModal: false,
      editing: null,
      form: { ticker: '', shares: 0, cost: 0, currency: 'TWD', current_price: 0, attributes: {} },

      // Cash modal state
      showCashModal: false,
      editingCash: null,
      cashForm: { name: '', balance: 0, currency: 'TWD', attributes: {} },

      // Debt modal state
      showDebtModal: false,

      // Intraday confirm dialog state (spec §6.2, ticket #12)
      // Snapshot action shows this when shouldWarnIntraday() returns true.
      showIntradayDialog: false,
      _intradayResolve: null,  // Promise resolver for the dialog
      editingDebt: null,
      debtForm: { name: '', balance: 0, currency: 'TWD', attributes: {} },

      // Sync state (ADR 0008 — GIS token model)
      showSyncModal: false,
      syncClientId: '',           // Google OAuth Client ID
      syncClientIdDraft: '',      // input field, committed via setSyncClientId()
      syncAccessToken: null,      // in-memory only (implicit flow, short-lived)
      syncTokenExpiresAt: 0,      // ms timestamp
      syncStatus: 'disconnected', // 'disconnected' | 'connecting' | 'syncing' | 'connected' | 'error'
      syncError: null,            // last error message
      tokenClient: null,          // GIS tokenClient (set by initSync)
      gisReady: false,            // GIS script loaded
      autoSyncEnabled: true,      // auto-push on save (default ON)
      autoPushTimer: null,        // setTimeout handle for debounced auto-push
      _lastSyncTimestamp: 0,      // ms; used to skip auto-push on our own writes

      // Refresh state (v1.1 — ADR 0009 §3)
      refreshState: 'idle',       // 'idle' | 'refreshing' | 'partial' | 'error'
      refreshCancelRequested: false,  // set by user click during refresh; loop checks at next iteration
      refreshFailures: [],        // array of failed tickers (in-memory only; not persisted)
      refreshError: null,         // string | null — error message for banner
      lastQuoteResults: {},       // { [ticker]: { marketState, ... } } — in-memory, for intraday detection

      // ---- Init ----
      init() {
        this.load();
        this.syncClientId = localStorage.getItem('property_tracker_sync_client_id') || '';
        this.syncClientIdDraft = this.syncClientId;
        this.autoSyncEnabled = localStorage.getItem('property_tracker_auto_sync') !== 'false';
        this.$watch('data', () => {
          this.save();
          // Skip auto-push if the change came from our own sync (within 100ms).
          if (Date.now() - (this._lastSyncTimestamp || 0) < 100) return;
          if (this.autoSyncEnabled && this.syncAccessToken && this.syncStatus !== 'syncing') {
            this.scheduleAutoPush();
          }
        }, { deep: true });
        this.waitForGis();
      },

      // ---- Sync (ADR 0008 — GIS token model) ----
      waitForGis() {
        // GIS loads async via <script async>. Poll until ready, then init tokenClient.
        if (window.google?.accounts?.oauth2) {
          this.gisReady = true;
          this.initSync();
          return;
        }
        setTimeout(() => this.waitForGis(), 100);
      },

      initSync() {
        if (!this.gisReady || !this.syncClientId) return;
        try {
          this.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: this.syncClientId,
            scope: 'https://www.googleapis.com/auth/drive.file',
            callback: (response) => {
              if (response.access_token) {
                this.syncAccessToken = response.access_token;
                this.syncTokenExpiresAt = Date.now() + (response.expires_in || 3600) * 1000;
                this.syncStatus = 'connected';
                this.syncError = null;
              } else if (response.error) {
                this.syncStatus = 'error';
                this.syncError = response.error;
                this.syncAccessToken = null;
              }
            },
            error_callback: (err) => {
              this.syncStatus = 'error';
              this.syncError = err.message || JSON.stringify(err);
            },
          });
        } catch (e) {
          this.syncStatus = 'error';
          this.syncError = e.message || String(e);
        }
      },

      setSyncClientId() {
        const id = this.syncClientIdDraft.trim();
        this.syncClientId = id;
        if (id) {
          localStorage.setItem('property_tracker_sync_client_id', id);
          this.syncError = null;
          this.initSync();
        } else {
          localStorage.removeItem('property_tracker_sync_client_id');
          this.tokenClient = null;
        }
      },

      deleteSyncClientId() {
        // Destructive: clears localStorage + disconnects if connected.
        // Confirmation is required because the user has to set up again to sync.
        if (!confirm(this.t('sync.confirmDeleteClientId'))) return;
        if (this.syncAccessToken) {
          this.disconnectDrive();
        }
        this.syncClientId = '';
        this.syncClientIdDraft = '';
        localStorage.removeItem('property_tracker_sync_client_id');
        this.tokenClient = null;
        this.syncError = null;
      },

      openSyncModal() {
        this.syncClientIdDraft = this.syncClientId;
        this.showSyncModal = true;
      },

      closeSyncModal() {
        this.showSyncModal = false;
      },

      headerClick() {
        // Header sync button: if client_id is set and we are not connected, click
        // goes straight to the OAuth flow (no modal). Otherwise the click opens
        // the modal — for first-time setup, status/error view, or settings.
        if (this.syncClientId && (this.syncStatus === 'disconnected' || this.syncStatus === 'error')) {
          this.connectDrive();
          return;
        }
        this.openSyncModal();
      },

      connectDrive() {
        if (!this.syncClientId) {
          this.syncStatus = 'error';
          this.syncError = 'No client_id configured';
          return;
        }
        if (!this.tokenClient) {
          this.syncStatus = 'error';
          this.syncError = 'Google Identity Services not loaded yet — try again in a moment';
          return;
        }
        this.syncStatus = 'connecting';
        this.syncError = null;
        // requestAccessToken requires user gesture; the button click is that gesture.
        // prompt: '' skips the consent screen when the user has already authorized
        // (e.g. on page reload, where the in-memory token is gone but Google's
        // authorization record persists). First-time users will still see consent
        // because Google falls back to UI when no prior authorization exists.
        this.tokenClient.requestAccessToken({ prompt: '' });
      },

      disconnectDrive() {
        if (this.syncAccessToken) {
          google.accounts.oauth2.revoke(this.syncAccessToken, () => {});
        }
        this.syncAccessToken = null;
        this.syncTokenExpiresAt = 0;
        this.syncStatus = 'disconnected';
        this.syncError = null;
      },

      get syncStatusLabel() {
        const key = `sync.status.${this.syncStatus}`;
        return this.t(key);
      },

      // ---- Refresh prices (v1.1 — ADR 0009 §3) ----
      get refreshLabel() {
        if (this.refreshState === 'refreshing') return this.t('header.refreshing');
        return this.t('header.refresh');
      },
      get retryFailedLabel() {
        return this.t('header.retryFailed', { n: this.refreshFailures.length });
      },
      get refreshErrorBanner() {
        if (!this.refreshError) return null;
        return this.t('header.refreshError', { reason: this.refreshError });
      },
      // Click handler: if already refreshing, set cancel flag instead of starting a new refresh.
      // The retry loop checks refreshCancelRequested at the top of each iteration and exits.
      // In-flight fetches are NOT aborted (browsers don't cleanly abort fetch; see ADR 0009 §2).
      refreshButtonClick() {
        if (this.refreshState === 'refreshing') {
          this.refreshCancelRequested = true;
          return;
        }
        // Pre-flight: catch "config.js not set up" before browser hits Failed to fetch.
        // Placed here (not in refreshAllPrices) so the manual "Retry N failed" path
        // doesn't re-show this banner when proxy already proved to work.
        if (!window.PORTFOLIO_CONFIG || !window.PORTFOLIO_CONFIG.yahooProxyUrl) {
          this.refreshState = 'error';
          this.refreshError = 'Yahoo proxy not configured. Copy config.js.example to config.js and set yahooProxyUrl. See README.md → "Yahoo CORS proxy setup".';
          return;
        }
        this.refreshAllPrices();
      },
      // Bulk refresh. symbols = null → all active holdings. Otherwise the explicit list.
      // Thin shim around the pure state machine in lib/refresh.js — this method
      // owns the in-memory side effects (writes to data.holdings, sets refreshState,
      // saves to localStorage / auto-pushes) so the lib can stay pure and tested.
      async refreshAllPrices(symbols = null) {
        if (this.refreshState === 'refreshing') {
          // Defensive: caller forgot to use refreshButtonClick(). Treat as cancel.
          this.refreshCancelRequested = true;
          return;
        }

        const targetSymbols = symbols || this.data.holdings
          .filter(h => !h.inactive)
          .map(h => h.ticker);

        if (targetSymbols.length === 0) return;

        this.refreshState = 'refreshing';
        this.refreshError = null;
        this.refreshCancelRequested = false;

        // Clear any prior _refresh_failed flags on the active holdings we'll process.
        // Inactive holdings keep whatever flag they had (they're not in this refresh).
        const targetSet = new Set(targetSymbols);
        for (const h of this.data.holdings) {
          if (targetSet.has(h.ticker)) h._refresh_failed = false;
        }

        // The lib only exposes succeeded/failed/cancelled in its return value,
        // so we capture the latest per-symbol results map inside onAttempt and
        // apply them after the lib returns. The lib is unaware of the
        // _refresh_failed / save() / scheduleAutoPush() concerns.
        let lastResults = {};

        // Wrap Yahoo.fetchQuotes so thrown errors become per-symbol failed
        // results (per v1.1 §3.5). Lets the lib treat catastrophic failure as
        // a normal retry-exhausted path.
        const fetchQuotes = async (syms) => {
          try {
            return await Yahoo.fetchQuotes(syms);
          } catch (e) {
            const out = {};
            for (const s of syms) out[s] = { failed: true, error: e.message || String(e) };
            return out;
          }
        };

        const res = await Refresh.runRefresh({
          symbols: targetSymbols,
          fetchQuotes,
          isCancelled: () => this.refreshCancelRequested,
          sleep: (ms) => this.sleep(ms),
          onAttempt: ({ attempt, pending, results }) => {
            // Capture the most-recent per-symbol result map; _applyRefreshResult
            // will use it after the loop. We intentionally do NOT publish
            // `pending` to this.refreshFailures here — the previous inline
            // behavior published that array only AFTER the loop completed (so
            // the 'Retry N failed' button doesn't appear while the loop is
            // still in a "partial / in-flight" state). _applyRefreshResult
            // updates this.refreshFailures at the end, preserving that timing.
            lastResults = results;
          },
        });

        this._applyRefreshResult(targetSet, lastResults, res);
      },

      // Apply per-symbol results back to this.data.holdings (in-memory only).
      // Source of truth for the rules lives in this comment block; the
      // actual computation is pure and lives in lib/refresh.js.
      //   - succeeded entries: write price fields, clear _refresh_failed,
      //     stash into lastQuoteResults (for MarketDisplay day-delta logic).
      //   - failed entries: set _refresh_failed = true.
      //   - inactive or non-target holdings: untouched.
      // Then: set refreshState (idle vs partial based on still-failed count),
      // persist via save() (which strips in-memory flags), and trigger the
      // background Drive push.
      _applyRefreshResult(targetSet, results, res) {
        // Mirror the lib's failed array into the reactive list exactly once —
        // BEFORE the in-memory holdings are mutated. This preserves the
        // previous inline behavior where 'Retry N failed' only appears after
        // the loop completes (so the button doesn't flash during retries).
        this.refreshFailures = res.failed.slice();

        for (const h of this.data.holdings) {
          if (!targetSet.has(h.ticker)) continue;
          const r = results[h.ticker];
          if (r && !r.failed) {
            h.current_price = r.current_price;
            h.high_52w = r.high_52w;
            h.low_52w = r.low_52w;
            h.prev_close = r.prev_close;
            h._refresh_failed = false;
            this.lastQuoteResults[h.ticker] = r;
          } else {
            h._refresh_failed = true;
          }
        }

        this.refreshState = this.refreshFailures.length > 0 ? 'partial' : 'idle';

        // Persist (save() strips in-memory flags; see lib/serialize.js).
        this.save();
        this.scheduleAutoPush();
      },

      // One-line delegation: refresh the tickers that the last run failed on.
      async retryFailed() {
        return this.refreshAllPrices(this.refreshFailures);
      },
      sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      },
      // Strip in-memory-only fields from holdings before serialization.
      // Per ADR 0009 §4, _refresh_failed is transient UI feedback and must not be persisted.
      // Otherwise the Drive merge could preserve stale flags and clobber real updates.
      // Source of truth: lib/serialize.js.
      serializeData(data) {
        return Serialize.serializeData(data);
      },

      // ---- Sync: Drive file ops (ADR 0008 + ADR 0002) ----
      async driveFetch(url, opts = {}) {
        if (!this.syncAccessToken) throw new Error('Not connected to Google Drive');
        const headers = {
          Authorization: `Bearer ${this.syncAccessToken}`,
          ...opts.headers,
        };
        const r = await fetch(url, { ...opts, headers });
        if (r.status === 401) {
          this.disconnectDrive();
          throw new Error('Access token expired — please reconnect');
        }
        if (!r.ok) {
          const body = await r.text().catch(() => '');
          throw new Error(`Drive API ${r.status}: ${body.slice(0, 200)}`);
        }
        return r;
      },

      async findPortfolioFile() {
        const q = "name='property_tracker_portfolio_v1.json' and trashed=false";
        const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name,modifiedTime)`;
        const r = await this.driveFetch(url);
        const data = await r.json();
        return data.files?.[0] || null;
      },

      async readPortfolioFile(fileId) {
        const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`;
        const r = await this.driveFetch(url);
        return await r.json();
      },

      async writePortfolioFile(fileId, data) {
        const url = `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`;
        const r = await this.driveFetch(url, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: this.serializeData(data),
        });
        return await r.json();
      },

      async createPortfolioFile(data) {
        const boundary = 'pt_boundary_' + Math.random().toString(36).slice(2);
        const meta = { name: 'property_tracker_portfolio_v1.json', mimeType: 'application/json' };
        const body =
          `--${boundary}\r\n` +
          `Content-Type: application/json; charset=UTF-8\r\n` +
          `\r\n` +
          `${JSON.stringify(meta)}\r\n` +
          `--${boundary}\r\n` +
          `Content-Type: application/json\r\n` +
          `\r\n` +
          `${this.serializeData(data)}\r\n` +
          `--${boundary}--\r\n`;
        const url = `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
        const r = await this.driveFetch(url, {
          method: 'POST',
          headers: { 'Content-Type': `multipart/related; boundary="${boundary}"` },
          body,
        });
        return await r.json();
      },

      // ---- Sync: orchestration + merge (ADR 0002 + ADR 0004) ----
      // All actual merge logic lives in lib/sync.js so it's pinned by
      // tests/sync.test.js. The methods below are thin Alpine shims that
      // pass our DEVICE_ID constant through to the lib.
      mergeById(localArr, remoteArr) {
        return Sync.mergeById(localArr, remoteArr);
      },

      mergePortfolios(local, remote) {
        return Sync.mergePortfolios(local, remote, DEVICE_ID);
      },

      async syncNow() {
        if (!this.syncAccessToken) throw new Error('Not connected to Google Drive');
        this.syncStatus = 'syncing';
        this.syncError = null;
        try {
          const file = await this.findPortfolioFile();
          if (file) {
            const remote = await this.readPortfolioFile(file.id);
            const merged = this.mergePortfolios(this.data, remote);
            merged.meta.last_synced_at = new Date().toISOString();
            merged.meta.device_id = DEVICE_ID;
            this._lastSyncTimestamp = Date.now();
            this.data = merged;
            await this.writePortfolioFile(file.id, this.data);
          } else {
            this.data.meta = this.data.meta || {};
            this.data.meta.last_synced_at = new Date().toISOString();
            this.data.meta.device_id = DEVICE_ID;
            this.data.meta.created_at = this.data.meta.created_at || new Date().toISOString();
            this._lastSyncTimestamp = Date.now();
            await this.createPortfolioFile(this.data);
          }
          this.syncStatus = 'connected';
        } catch (e) {
          this.syncStatus = 'error';
          this.syncError = e.message || String(e);
          throw e;
        }
      },

      scheduleAutoPush() {
        if (!this.autoSyncEnabled) return;
        if (!this.syncAccessToken) return;
        if (this.syncStatus === 'syncing') return;
        clearTimeout(this.autoPushTimer);
        this.autoPushTimer = setTimeout(() => {
          if (this.autoSyncEnabled && this.syncAccessToken && this.syncStatus !== 'syncing') {
            this.syncNow().catch(() => { /* error already in syncError */ });
          }
        }, 5000);
      },

      toggleAutoSync() {
        this.autoSyncEnabled = !this.autoSyncEnabled;
        localStorage.setItem('property_tracker_auto_sync', String(this.autoSyncEnabled));
        if (!this.autoSyncEnabled) {
          clearTimeout(this.autoPushTimer);
          this.autoPushTimer = null;
        }
      },

      relativeTime(isoString) {
        if (!isoString) return this.t('sync.neverSynced');
        const ms = Date.now() - Date.parse(isoString);
        if (Number.isNaN(ms) || ms < 0) return this.t('sync.justNow');
        if (ms < 60_000) return this.t('sync.justNow');
        const min = Math.floor(ms / 60_000);
        if (min < 60) return `${min}m`;
        const hr = Math.floor(min / 60);
        if (hr < 24) return `${hr}h`;
        return `${Math.floor(hr / 24)}d`;
      },

      // ---- Persistence ----
      load() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            // Migrate v0.2 data: cost (total) → cost (per-share)
            if (parsed.holdings && parsed.settings?.cost_format !== 'per_share') {
              parsed.holdings.forEach(h => {
                if (h.shares > 0 && h.cost) {
                  h.cost = h.cost / h.shares;
                }
              });
            }
            this.data = { ...defaultPortfolio(), ...parsed };
            this.data.settings = { ...defaultPortfolio().settings, ...this.data.settings };
            this.data.settings.cost_format = 'per_share';
            if (!this.data.cash_accounts) this.data.cash_accounts = [];
            if (!this.data.debts) this.data.debts = [];
            // v1.3 additive fields: lazy-init the deletion log and the
            // in-portfolio backups. Both are arrays of records merged
            // by lib/sync.js via mergeById — no version bump needed
            // because adding a missing array is additive (ADR 0009 §6).
            if (!this.data.deletions) this.data.deletions = [];
            if (!this.data.backups) this.data.backups = [];
            this.data.holdings.forEach(h => { if (!h.attributes) h.attributes = {}; });
            this.data.cash_accounts.forEach(c => { if (!c.attributes) c.attributes = {}; });
            this.data.debts.forEach(d => { if (!d.attributes) d.attributes = {}; });
            // Migrate v0.4 categories: no applies_to → ['holdings'] (most common intent)
            this.data.categories.forEach(c => {
              if (!c.applies_to) c.applies_to = ['holdings'];
            });
            // v1.0 → v1.1 migration (non-destructive): add 52W + prev_close fields.
            // Each holding gets null for missing new fields; the next refresh will populate.
            // Bump version on load, before any save. See ADR 0009 §6.
            this.data.holdings.forEach(h => {
              if (h.high_52w === undefined) h.high_52w = null;
              if (h.low_52w === undefined) h.low_52w = null;
              if (h.prev_close === undefined) h.prev_close = null;
            });
            // Defensive: strip stale in-memory flags from a prior version's localStorage (ADR 0009 §4).
            Serialize.stripInMemoryFields(this.data.holdings);
            this.data.version = '1.1';
          } catch (e) {
            console.error('Failed to load portfolio', e);
          }
        }
        this.displayCurrency = this.data.settings.display_currency || 'TWD';
        this.language = this.data.settings.language || 'en';
      },

      save() {
        this.data.settings.display_currency = this.displayCurrency;
        this.data.settings.language = this.language;
        this.data.settings.cost_format = 'per_share';
        localStorage.setItem(STORAGE_KEY, this.serializeData(this.data));
      },

      // ---- i18n ----
      t(key, params) {
        let s = STRINGS[this.language]?.[key] || STRINGS.en?.[key] || key;
        if (params) {
          Object.entries(params).forEach(([k, v]) => {
            s = s.replace(`{${k}}`, v);
          });
        }
        return s;
      },

      // ---- Getters ----
      get holdings() { return this.data.holdings; },
      get categories() { return this.data.categories; },
      get cashAccounts() { return this.data.cash_accounts; },
      get debts() { return this.data.debts; },
      get categoriesForHoldings() {
        return this.data.categories.filter(c => c.applies_to?.includes('holdings'));
      },
      get categoriesForCash() {
        return this.data.categories.filter(c => c.applies_to?.includes('cash'));
      },
      get categoriesForDebts() {
        return this.data.categories.filter(c => c.applies_to?.includes('debt'));
      },
      get groupByCategories() {
        return this.data.categories.filter(c =>
          c.applies_to?.some(t => ['holdings', 'cash', 'debt'].includes(t))
        );
      },

      // ---- Holdings CRUD ----
      openAdd() {
        this.editing = null;
        this.form = { ticker: '', shares: 0, cost: 0, currency: 'TWD', current_price: 0, attributes: {} };
        this.showModal = true;
      },
      openEdit(h) {
        this.editing = h;
        this.form = {
          ticker: h.ticker, shares: h.shares, cost: h.cost,
          currency: h.currency, current_price: h.current_price,
          attributes: { ...(h.attributes || {}) },
        };
        this.showModal = true;
      },
      closeModal() {
        this.showModal = false;
        this.editing = null;
      },
      setFormAttribute(catId, valId) {
        if (valId) this.form.attributes[catId] = valId;
        else delete this.form.attributes[catId];
      },
      saveHolding() {
        const now = new Date().toISOString();
        const id = this.editing ? this.editing.id : genId('h');
        const attributes = {};
        for (const [catId, valId] of Object.entries(this.form.attributes || {})) {
          if (valId) attributes[catId] = valId;
        }
        const record = {
          id, ticker: this.form.ticker.toUpperCase().trim(),
          shares: this.form.shares, cost: this.form.cost,
          currency: this.form.currency, current_price: this.form.current_price,
          // v1.1: 52W high/low + previous close. Null until refreshed.
          high_52w: this.editing?.high_52w ?? null,
          low_52w: this.editing?.low_52w ?? null,
          prev_close: this.editing?.prev_close ?? null,
          attributes, updated_at: now, device_id: DEVICE_ID,
          inactive: this.editing ? this.editing.inactive : false,
        };
        if (this.editing) {
          const idx = this.data.holdings.findIndex(h => h.id === this.editing.id);
          if (idx >= 0) this.data.holdings[idx] = record;
        } else {
          this.data.holdings.push(record);
        }
        this.closeModal();
      },
      // removeHolding: true-delete via lib/records.recordDeletion. Thin
      // shim — see _removeRecord for the shared logic (confirm prompt,
      // splice + tombstone append, reactive assign-back). The deletion
      // log + tombstone contract is documented in ADR 0011 (draft —
      // ticket 04). Inactive and Deleted are
      // separate concepts — the glossary forbids conflating them.
      // Shared thin shim for true-delete + tombstone append. Called
      // by removeHolding / removeCash / removeDebt below.
      _removeRecord(id, collection, confirmKey) {
        if (!confirm(this.t(confirmKey))) return;
        const out = Records.recordDeletion(this.data[collection], this.data.deletions, {
          targetId: id,
          type: collection,
          deviceId: DEVICE_ID,
          deletedAt: new Date().toISOString(),
          genDelId: () => genId('del'),
        });
        if (!out.didDelete) return;
        this.data[collection] = out.records;
        this.data.deletions = out.deletions;
      },
      removeHolding(id) { this._removeRecord(id, 'holdings', 'holdings.confirmDelete'); },
      toggleInactive(id) {
        const h = this.data.holdings.find(h => h.id === id);
        if (h) {
          h.inactive = !h.inactive;
          h.updated_at = new Date().toISOString();
          h.device_id = DEVICE_ID;
        }
      },

      // ---- Cash CRUD ----
      openAddCash() {
        this.editingCash = null;
        this.cashForm = { name: '', balance: 0, currency: 'TWD', attributes: {} };
        this.showCashModal = true;
      },
      openEditCash(c) {
        this.editingCash = c;
        this.cashForm = {
          name: c.name, balance: c.balance, currency: c.currency,
          attributes: { ...(c.attributes || {}) },
        };
        this.showCashModal = true;
      },
      closeCashModal() {
        this.showCashModal = false;
        this.editingCash = null;
      },

      // ---- v1.1: Intraday confirm dialog (spec §6.2, ticket #12). Source of truth: lib/intraday.js.
      // Delegates detection to the pure lib function.
      shouldWarnIntraday() {
        return Intraday.shouldWarnIntraday(this.holdings, this.lastQuoteResults);
      },
      // Promise-based dialog API. Caller awaits the result.
      // Resolution pattern avoids callback hell in takeSnapshot().
      showIntradayConfirmDialog() {
        return new Promise((resolve) => {
          this._intradayResolve = resolve;
          this.showIntradayDialog = true;
        });
      },
      confirmIntradaySnapshot() {
        this.showIntradayDialog = false;
        if (this._intradayResolve) {
          this._intradayResolve(true);
          this._intradayResolve = null;
        }
      },
      cancelIntradaySnapshot() {
        this.showIntradayDialog = false;
        if (this._intradayResolve) {
          this._intradayResolve(false);
          this._intradayResolve = null;
        }
      },
      // Snapshot action wiring. The dialog flow (intraday confirm, overwrite
      // confirm) lives here in Alpine; the actual snapshot construction
      // (date / holdings / cash / debts / fx_rate / totals / delta + in-memory
      // flag stripping) lives in lib/snapshot.js (ADR 0005). The Alpine
      // method is a thin shim: dialog → Snapshot.buildSnapshot → write +
      // save.
      async takeSnapshot() {
        if (this.shouldWarnIntraday()) {
          const confirmed = await this.showIntradayConfirmDialog();
          if (!confirmed) return;
        }
        if (!this.data.snapshots) this.data.snapshots = [];
        const prevSnapshot = this.data.snapshots[this.data.snapshots.length - 1] || null;
        const snap = Snapshot.buildSnapshot(this.data, {
          now: new Date(),
          fxRate: this.fxRate(),
          prevSnapshot,
        });
        this.data.snapshots.push(snap);
        this.save();
      },
      setCashFormAttribute(catId, valId) {
        if (valId) this.cashForm.attributes[catId] = valId;
        else delete this.cashForm.attributes[catId];
      },
      saveCash() {
        const now = new Date().toISOString();
        const id = this.editingCash ? this.editingCash.id : genId('cash');
        const attributes = {};
        for (const [catId, valId] of Object.entries(this.cashForm.attributes || {})) {
          if (valId) attributes[catId] = valId;
        }
        const record = {
          id, name: this.cashForm.name.trim(),
          balance: this.cashForm.balance, currency: this.cashForm.currency,
          attributes, updated_at: now, device_id: DEVICE_ID,
          inactive: this.editingCash ? this.editingCash.inactive : false,
        };
        if (this.editingCash) {
          const idx = this.data.cash_accounts.findIndex(c => c.id === this.editingCash.id);
          if (idx >= 0) this.data.cash_accounts[idx] = record;
        } else {
          this.data.cash_accounts.push(record);
        }
        this.closeCashModal();
      },
      removeCash(id) { this._removeRecord(id, 'cash_accounts', 'cash.confirmDelete'); },
      toggleCashInactive(id) {
        const c = this.data.cash_accounts.find(c => c.id === id);
        if (c) {
          c.inactive = !c.inactive;
          c.updated_at = new Date().toISOString();
          c.device_id = DEVICE_ID;
        }
      },

      // ---- Debt CRUD ----
      openAddDebt() {
        this.editingDebt = null;
        this.debtForm = { name: '', balance: 0, currency: 'TWD', attributes: {} };
        this.showDebtModal = true;
      },
      openEditDebt(d) {
        this.editingDebt = d;
        this.debtForm = {
          name: d.name, balance: d.balance, currency: d.currency,
          attributes: { ...(d.attributes || {}) },
        };
        this.showDebtModal = true;
      },
      closeDebtModal() {
        this.showDebtModal = false;
        this.editingDebt = null;
      },
      setDebtFormAttribute(catId, valId) {
        if (valId) this.debtForm.attributes[catId] = valId;
        else delete this.debtForm.attributes[catId];
      },
      saveDebt() {
        const now = new Date().toISOString();
        const id = this.editingDebt ? this.editingDebt.id : genId('debt');
        const attributes = {};
        for (const [catId, valId] of Object.entries(this.debtForm.attributes || {})) {
          if (valId) attributes[catId] = valId;
        }
        const record = {
          id, name: this.debtForm.name.trim(),
          balance: this.debtForm.balance, currency: this.debtForm.currency,
          attributes, updated_at: now, device_id: DEVICE_ID,
          inactive: this.editingDebt ? this.editingDebt.inactive : false,
        };
        if (this.editingDebt) {
          const idx = this.data.debts.findIndex(d => d.id === this.editingDebt.id);
          if (idx >= 0) this.data.debts[idx] = record;
        } else {
          this.data.debts.push(record);
        }
        this.closeDebtModal();
      },
      removeDebt(id) { this._removeRecord(id, 'debts', 'debts.confirmDelete'); },
      toggleDebtInactive(id) {
        const d = this.data.debts.find(d => d.id === id);
        if (d) {
          d.inactive = !d.inactive;
          d.updated_at = new Date().toISOString();
          d.device_id = DEVICE_ID;
        }
      },

      // ---- Categories ----
      addCategory() {
        this.data.categories.push({ ...defaultCategory(), id: genId('cat') });
      },
      toggleCategoryAppliesTo(catId, type) {
        const cat = this.data.categories.find(c => c.id === catId);
        if (!cat) return;
        if (!cat.applies_to) cat.applies_to = ['holdings']; // safety for unmigrated
        const idx = cat.applies_to.indexOf(type);
        if (idx >= 0) cat.applies_to.splice(idx, 1);
        else cat.applies_to.push(type);
      },
      deleteCategory(catId) {
        if (!confirm('Delete this category? Holdings/cash/debts will lose this attribute.')) return;
        this.data.categories = this.data.categories.filter(c => c.id !== catId);
        const clean = (items) => items.forEach(item => {
          if (item.attributes && catId in item.attributes) delete item.attributes[catId];
        });
        clean(this.data.holdings);
        clean(this.data.cash_accounts);
        clean(this.data.debts);
      },
      addValue(cat) {
        if (!cat.values) cat.values = [];
        cat.values.push({ id: genId('val'), name: 'New Value' });
      },
      deleteValue(catId, valId) {
        const cat = this.data.categories.find(c => c.id === catId);
        if (!cat) return;
        cat.values = cat.values.filter(v => v.id !== valId);
        const clean = (items) => items.forEach(item => {
          if (item.attributes && item.attributes[catId] === valId) delete item.attributes[catId];
        });
        clean(this.data.holdings);
        clean(this.data.cash_accounts);
        clean(this.data.debts);
      },

      // ---- Display helpers ----
      getCategoryValueName(catId, valId) {
        const cat = this.data.categories.find(c => c.id === catId);
        if (!cat) return '?';
        const val = cat.values?.find(v => v.id === valId);
        if (!val) return '?';
        return val.name;
      },

      // ---- Grouping (generic) ----
      // Source of truth for the bucket math lives in lib/group.js. The Alpine
      // methods below are thin shims: each closes over this.data.* and the
      // this.fxRate() getter so the x-for bindings on the Home page keep
      // working unchanged. The _localizeUnassigned() helper swaps the lib's
      // English placeholder for the i18n-catalog value_name because Alpine
      // owns the translation table (lib/group.js is pure + Node-testable).

      _localizeUnassigned(groups) {
        const label = this.t('groupBy.unassigned');
        groups.forEach(g => {
          if (g.value_id === '_unassigned') g.value_name = label;
        });
        return groups;
      },

      holdingsGroupedBy(catId) {
        return this._localizeUnassigned(
          Group.holdingsGroupedBy(this.data.holdings, this.data.categories, catId, this.fxRate())
        );
      },
      cashGroupedBy(catId) {
        return this._localizeUnassigned(
          Group.cashGroupedBy(this.data.cash_accounts, this.data.categories, catId, this.fxRate())
        );
      },
      debtsGroupedBy(catId) {
        return this._localizeUnassigned(
          Group.debtsGroupedBy(this.data.debts, this.data.categories, catId, this.fxRate())
        );
      },

      // ---- Calculations ----
      // Source of truth for these helpers lives in lib/calc.js (so tests/
      // calc.test.js can exercise them under node:test). The Alpine methods
      // below are thin shims that close over this.data.* and the
      // this.fxRate() / this.displayCurrency getters.
      fxRate() { return this.data.settings.fx_rate || 32.2; },
      gainLoss(h) { return Calc.gainLoss(h); },

      // ---- v1.1: Day Δ% (spec §4.2, ADR 0009 §9). Source of truth: lib/market-display.js.
      dayDeltaLabel(h) { return MarketDisplay.dayDeltaLabel(h); },
      dayDeltaClass(h) { return MarketDisplay.dayDeltaClass(h); },

      // ---- v1.1: 52W range bar (spec §4.3, ADR 0009 §9). Source of truth: lib/market-display.js.
      week52Style(h) { return MarketDisplay.week52Style(h); },

      // Internal TWD aggregations live in lib/calc.js. The Alpine methods
      // below are thin shims: each closes over this.data.* and the
      // this.fxRate() / this.displayCurrency getters so the x-text bindings
      // on the Home page keep working unchanged.

      // Display currency aggregations
      holdingsValue() {
        return Calc.holdingsValue(this.data.holdings, this.displayCurrency, this.fxRate());
      },
      holdingsCost() {
        return Calc.holdingsCost(this.data.holdings, this.displayCurrency, this.fxRate());
      },
      holdingsGainLoss() {
        return Calc.holdingsGainLoss(this.data.holdings, this.displayCurrency, this.fxRate());
      },
      holdingsGainLossPct() {
        return Calc.holdingsGainLossPct(this.data.holdings, this.displayCurrency, this.fxRate());
      },
      totalCash() {
        return Calc.totalCash(this.data.cash_accounts, this.displayCurrency, this.fxRate());
      },
      totalDebts() {
        return Calc.totalDebts(this.data.debts, this.displayCurrency, this.fxRate());
      },
      netWorth() {
        return Calc.netWorth(
          this.data.holdings, this.data.cash_accounts, this.data.debts,
          this.displayCurrency, this.fxRate()
        );
      },

      activeHoldingsCount() { return Calc.activeCount(this.data.holdings); },
      activeCashCount() { return Calc.activeCount(this.data.cash_accounts); },
      activeDebtsCount() { return Calc.activeCount(this.data.debts); },

      // ---- Formatting ----
      // Thin wrapper around window.formatAmount (lib/format.js). Source of truth for the
      // compact suffix rules lives in lib/format.js so tests/format.test.js can verify it
      // without spinning up a browser.
      formatAmount(amount, sourceCurrency) {
        return window.formatAmount(amount, sourceCurrency, this.displayCurrency, this.fxRate());
      },

      // ---- Actions ----
      setCurrency(c) { this.displayCurrency = c; },
      setLanguage(lang) { this.language = lang; },
      downloadJSON() {
        const blob = new Blob([this.serializeData(this.data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'portfolio.json'; a.click();
        URL.revokeObjectURL(url);
      },

      async handleImportFile(event) {
        const file = event.target.files[0];
        if (!file) return;
        event.target.value = ''; // reset so same file can be re-imported
        let parsed;
        try {
          const text = await file.text();
          parsed = JSON.parse(text);
        } catch (e) {
          alert(this.t('import.lastError') + ': ' + e.message);
          return;
        }
        if (!parsed.version || typeof parsed.version !== 'string') {
          alert(this.t('import.invalid'));
          return;
        }
        if (!confirm(this.t('import.confirmReplace'))) return;
        // Migrate-merge like load() does, so missing fields get defaults
        this.data = { ...defaultPortfolio(), ...parsed };
        this.data.settings = { ...defaultPortfolio().settings, ...this.data.settings };
        this.data.settings.cost_format = 'per_share';
        if (!this.data.cash_accounts) this.data.cash_accounts = [];
        if (!this.data.debts) this.data.debts = [];
        // v1.3 additive fields: see load() for the same lazy-init.
        if (!this.data.deletions) this.data.deletions = [];
        if (!this.data.backups) this.data.backups = [];
        this.data.holdings.forEach(h => { if (!h.attributes) h.attributes = {}; });
        // Strip in-memory flags defensively (ADR 0009 §4).
        Serialize.stripInMemoryFields(this.data.holdings);
        this.data.cash_accounts.forEach(c => { if (!c.attributes) c.attributes = {}; });
        // $watch('data', ...) will trigger save() + auto-push
      },

      // ---- Summary ----
      get summary() {
        const h = this.activeHoldingsCount();
        const c = this.activeCashCount();
        const d = this.activeDebtsCount();
        const cat = this.data.categories.length;
        const s = this.data.snapshots.length;
        return `${h} holdings · ${c} cash · ${d} debts · ${cat} categories · ${s} snapshots · device ${DEVICE_ID}`;
      },
    };
  }
</script>
