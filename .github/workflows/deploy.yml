# Deploy portfolio.html + assets to GitHub Pages.
#
# The repo intentionally does NOT commit `config.js` (it carries the user's
# Cloudflare Worker URL — keeping it out of the public repo protects the
# Worker's free-tier quota from being drained by anyone scraping the URL).
# This workflow synthesises `config.js` from a GitHub Actions secret at
# deploy time so GitHub Pages still serves a working app without ever
# exposing the Worker URL in git history.
#
# Setup (one-time, on the GitHub repo):
#   1. Settings → Secrets and variables → Actions → New repository secret
#        Name:  YAHOO_PROXY_URL
#        Value: https://yahoo-proxy.YOURACCOUNT.workers.dev
#   2. Settings → Pages → Source → "GitHub Actions"
name: Deploy to GitHub Pages
on:
  push:
    branches: [develop]
  workflow_dispatch:

# Minimum permissions for actions/deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel a deploy that's mid-flight if a new push arrives; the previous
# one will finish first.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Materialise config.js from YAHOO_PROXY_URL secret
        # config.js is gitignored at the repo level, so this runs in CI only.
        # The secret is explicitly mapped to an env var on this step rather
        # than referenced as $YAHOO_PROXY_URL in bash: GitHub Actions does
        # not always expose secrets as shell env vars (depends on secret
        # type + job context), but explicit env: mapping always works.
        # If the secret is unset, we write an empty value so the page still
        # loads — Yahoo refresh will then fail with a clear "not configured"
        # error (see portfolio.html:3230) instead of a generic fetch error.
        env:
          YAHOO_PROXY_URL: ${{ secrets.YAHOO_PROXY_URL || '' }}
        run: |
          {
            echo "window.PORTFOLIO_CONFIG = {"
            echo "  yahooProxyUrl: '${YAHOO_PROXY_URL}',"
            echo "};"
          } > config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
